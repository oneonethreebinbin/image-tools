name: Sync to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to HuggingFace Space
        uses: nkoppel/push-git-repo@v1
        with:
          repository: "https://${{ secrets.HF_username }}:${{ secrets.HF_token }}@huggingface.co/spaces/viewmax/watermark-remover"
          branch: "main"
          force: true
